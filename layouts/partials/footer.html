<footer class="footer">
    <div class="footer__inner">
        {{ if $.Site.Copyright }}
        <div class="copyright copyright--user">
            <span>{{ $.Site.Copyright | safeHTML }}</span>
            {{ else }}
            <div class="copyright">
                <span>© {{ now.Year }} Powered by <a href="http://gohugo.io">Hugo</a></span>
                {{ end }}
                <span>:: <a href="https://github.com/panr/hugo-theme-terminal" target="_blank">Theme</a> made by <a
                        href="https://github.com/panr" target="_blank">panr</a></span>
                <span>&nbsp;:: Logo by <a href="https://github.com/Brent-rb" target="_blank">Brent-rb</a></span>
            </div>
        </div>
</footer>

{{ $menu := resources.Get "js/menu.js" | js.Build }}
